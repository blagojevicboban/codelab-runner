# Example nginx site for the CodeLab runner: TLS in front of the server on 127.0.0.1:8090.
server {
    listen 443 ssl;
    server_name runner.example.org;

    ssl_certificate     /etc/letsencrypt/live/runner.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runner.example.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        # A session may wait for input for minutes.
        proxy_read_timeout 600s;
    }
}
